<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 56" fill="none" aria-hidden="true">
  <!-- Event'Light base mark: square + expanding beam (projector) -->
  <!-- Subtle chromatic fringe (secondary) -->
  <g opacity=".45" stroke-width="1.75" stroke-linejoin="miter" stroke-linecap="square">
    <rect x="7.35" y="18" width="20" height="20" stroke="#00E5FF"/>
    <polygon points="17.35,28 79.35,4 79.35,52" stroke="#00E5FF"/>
    <rect x="8.65" y="18" width="20" height="20" stroke="#FF2A2A"/>
    <polygon points="18.65,28 80.65,4 80.65,52" stroke="#FF2A2A"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1.85" stroke-linejoin="miter" stroke-linecap="square">
    <rect x="8" y="18" width="20" height="20"/>
    <polygon points="18,28 80,4 80,52"/>
  </g>
</svg>
